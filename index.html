<body>
<div class="container">

    <!-- HEADER -->
    <div class="header">
        <div class="brand"><span class="logo">🔥 SN Mods</span></div>
        <h1><span class="icon">🏘️</span> Smali Town</h1>
        <span class="badge">📘 20 Lessons</span>
    </div>

    <!-- INTRO -->
    <div class="intro-card">
        <div class="lesson-number">📖 Welcome</div>
        <h2>Learn Smali & Android Modding</h2>
        <p>
            Tap any lesson below to start. Go step by step from <strong>Lesson 1</strong> to
            <strong>Lesson 20</strong> to go from total beginner to confidently patching real apps.
        </p>
    </div>

    <!-- LESSON LIST -->
    <div class="lesson-list-title">
        <h3>All Lessons</h3>
        <span>1 – 20</span>
    </div>

    <div class="lesson-grid" id="lessonGrid"></div>

    <!-- FOOTER -->
    <div class="footer">
        <span class="sn">🔥 SN Mods</span> <span style="color:#4a5a6a;"> • </span>
        <span class="heart">❤️</span> <span style="color:#4a5a6a;"> • </span>
        <span class="tag">@Cyber_Ninja513</span><br />
        <span style="color:#4a5a6a; font-size:0.7rem;">Smali Town • Home</span>
    </div>

</div>
<script>
    const topics = [
        "What is Smali?",
        "Data Types & Registers",
        "Basic OpCodes (Instructions)",
        "Conditional Statements (if/else)",
        "Working with Methods",
        "Loops in Smali",
        "Working with Fields (Variables)",
        "Arrays & Lists",
        "try/catch & Error Handling",
        "Classes & Interfaces",
        "Constructors",
        "Static vs Non-Static Methods",
        "Working with Strings",
        "Math & Calculations",
        "Type Casting",
        "SharedPreferences",
        "Finding VIP & Premium Code",
        "Advanced Modding Techniques",
        "Project 1: Modding a Simple App",
        "Project 2: Advanced App Modding"
    ];

    const grid = document.getElementById('lessonGrid');
    let html = '';
    for (let i = 1; i <= 20; i++) {
        html += `
        <a class="lesson-btn" href="snmods${i}.html">
            <span class="num">${i}</span>
            <span class="info">
                <span class="lbl">Lesson ${i}</span>
                <span class="topic">${topics[i - 1]}</span>
            </span>
            <span class="arrow">›</span>
        </a>`;
    }
    grid.innerHTML = html;

    document.addEventListener('gesturestart', function(e){e.preventDefault();});
    document.addEventListener('keydown', function(e){
        if(e.ctrlKey && (e.key==='+'||e.key==='-'||e.key==='0')) e.preventDefault();
    });
    document.addEventListener('wheel', function(e){
        if(e.ctrlKey) e.preventDefault();
    }, {passive: false});
    document.querySelector('.container').addEventListener('touchmove', function(e){
        if(e.touches.length > 1) e.preventDefault();
    }, {passive: false});
    console.log('✅ SN Mods | Smali Town - Home loaded');
    console.log('😈 @Cyber_Ninja513');
</script>
